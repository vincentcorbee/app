<style>
  :host {
    padding: 8px;
    display: flex;
    width: 100%;
  }

  ui-button {
    margin-left: auto;
  }
  label {
    display: flex;
    flex: 1;
    align-items: center;
  }
</style>

<label>
  <input type="checkbox" @change="toggle(todo)" *bind:checked="todo.done" />
  <del if="todo.done"> {{ todo.text }} </del> <span else> {{ todo.text }} </span>
  <ui-button type="button" @click="emit('remove-todo', todo.id)">Remove</ui-button>
</label>
