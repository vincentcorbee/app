<!-- This will add the css to the shadowDom if enabled -->
<style>
  :host {
    display: block;
    padding: 24px;
    background-color: white;
    border-radius: 5px;
  }

  .loader {
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    position: fixed;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: rgba(255, 255, 255, 0.5)
  }

</style>

<div *if="loading" class="loader">
  {{ action }}
</div>

<div *if="todos">
  <span>Todos: {{ todos.length }} </span>
  <todo-list *bind:todos="todos" @remove-todo="removeTodo"></todo-list>
  <div>
    <input type="text" *model="newTodo"/>
    <button @click="addTodo">Add todo</button>
  </div>
  <div>
    <span>{{ newTodo }}</span>
  </div>
  <pre>{{ todos }}</pre>
</div>
<div *else>
  <span>Loading</span>
</div>
