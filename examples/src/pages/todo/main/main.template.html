<div *if="todos" class="flex flex-direction-column">

    </ui-input>

  </div>
  <div class="flex">
    <div class="flex-1">
      <todo-list *bind:todos="todos" @remove-todo="removeTodo" />
    </div>
    <pre class="flex-1">{{ todos }}</pre>

<div *else>
