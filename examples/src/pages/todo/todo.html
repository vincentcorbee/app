<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Todo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      [a-cloak] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="app" a-cloak>
      <ui-button @click="add(1)">Add one</ui-button>

      <div>
        <h3>Self invocation function</h3>
        <div>{{ (function (a) { return this.counter + a; })(20) }}</div>

        <h3>Component property</h3>
        <div>{{ counter }}</div>
      </div>
      <h1>{{ title }}</h1>
      <h2>{{ fullName }}</h2>
      <main>
        <app-main />
      </main>
    </div>
  </body>
</html>
