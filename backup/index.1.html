  <div id="todos">
    <h2>{{ title }}</h2>
    <ol>
      <li for="todo in todos">
        <label>
          <input type="checkbox" on:change="toggle(todo)" bind:checked="todo.done">
          <del if="todo.done">
            {{ todo.text }}
          </del>
          <span else>
            {{ todo.text }}
          </span>
          <span>
            not me
          </span>
        </label>
      </li>
    </ol>
    <input type='text' model='newTodo' /> {{ newTodo }}
    <button on:click='addTodo'>Add todo</button>
    <component-a bind:item='item'>Instance A</component-a>
    <div class='posts' bind:style='{ fontSize: postFontSize + "em" }'>
      <blog-post for="post in posts" bind:key="post.id" bind:post="post" on:enlarge-text='enlargeText' on:shrink-text='shrinkText'></blog-post>
    </div>
  </div>
