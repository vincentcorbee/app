<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Page Title</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    .formWrapper {
      padding: 20px;
      background: #20262E;
    }
    #form {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 4px;
    }
    .wrapper {
      background-color: #ffffff;
      padding: 20px;
    }

    .wrapper .label {
      display: inline-block;
      margin-right: 10px;
    }

    .wrapper>div:not(:last-of-type) {
      margin-bottom: 10px;
    }

    .input {
      white-space: pre;
    }

    .trees,
    .parseTable {
      background-color: #ffffff;
    }

    .parseTableContainer {
      background-color: #ffffff;
      padding: 20px;
    }

    .parseTree,
    .ASTTree {
      max-width: 1000px;
      overflow-x: auto;
      width: 100%;
    }

    .parseTable {
      max-width: 1000px;
      width: 100%;
      overflow-x: auto;
    }

    .table {
      font-size: 0.75rem;
      border: 1px solid black;
    }

    .row,
    .header {
      padding: 5px;
      border-bottom: 1px solid black;
      white-space: nowrap;
    }

    .row {
      flex: 1;
    }

    .row:last-of-type {
      border-bottom: 0;
    }

    .col,
    .header {
      border-right: 1px solid black;
      flex: 1;
    }

    .col:last-of-type,
    .header:last-of-type {
      border-right: none;
    }

    .dot {
      color: red;
      font-size: 1.25rem;
      display: inline-block;
      vertical-align: middle;
    }

    .tree {
      font-size: 0.75rem;
    }

    .flex {
      display: flex;
    }

    .flexcolumn {
      flex-direction: column;
    }

    .name {
      text-align: center;
      padding: 10px;
      border: 1px solid #000000;
    }

    .node {
      margin: 2px;
    }

    .children {}

    .hcenter {
      justify-content: center;
    }

    .vcenter {
      align-items: center;
    }

    [a-cloak] {
      display: none;
    }

    [aria-hidden='true'] {
      display: none;
    }

    body {
      background: #20262E;
      padding: 0;
      margin: 0;
      font-family: Helvetica;
    }

    blog-post {
      background-color: #c5cdd8;
      padding: 20px;
      border-radius: 3px;
      display: block;
      margin-bottom: 10px;
    }

    #todos {
      background: #fff;
      border-radius: 4px;
      padding: 20px;
      margin: 20px;
      transition: all 0.2s;
    }

    #app {
      background-color: #ffffff;
      padding: 20px;
    }

    li {
      margin: 8px 0;
    }

    h2 {
      font-weight: bold;
      margin-bottom: 15px;
    }

    del {
      color: rgba(0, 0, 0, 0.3);
    }
  </style>
</head>

<body>
  <div id="todos" a-cloak>
    <h2>Views</h2>
    <r-link to='/'>Main</r-link>
    <r-link to='/overview'>Overview</r-link>
    <r-link to='/users'>Users</r-link>
    <r-link to='/user/vincent'>User</r-link>
    <r-view name='main'></r-view>
    <r-view></r-view>
    <h2>{{ title }}</h2>
    {{ todos.length }}
    <ul>
      <li a-for='(todo, index) in todos'>
        {{ index }}
        <todo-item bind:todo='todo'></todo-item><button on:click='removeTodo(index)'>remove</button>
      </li>
    </ul>
    <input type='text' a-model='newTodo' />Some static content {{ newTodo }} Some static content
    <button on:click='addTodo'>Add todo</button>
    <pre>{{ todos }}</pre>
    <component-a bind:item='item'>Instance A</component-a>
    <div class='posts' bind:style='{ fontSize: postFontSize + "em" }'>
      <blog-post a-for="post in posts" bind:key="post.id" bind:post="post" on:enlarge-text='enlargeText' on:shrink-text='shrinkText'></blog-post>
    </div>
  </div>
  <div class='formWrapper'>
    <form id="form" a-cloak>
      <div>
        <div>
          <span>Gender</span>
          <div>
            <label for='male'>
              <span>Male</span>
              <input type='radio' a-model='user.person.gender' value='male' id='male'/>
            </label>
            <label for='female'>
              <span>Female</span>
              <input type='radio' a-model='user.person.gender' value='female' id='female'/>
            </label>
          </div>
        </div>
        <div>
          <label for='firstname'>Firstname</label>
          <input type='text' id='firstname' a-model='user.person.firstname'/>
        </div>
        <div>
          <label for='lastname'>Lastname</label>
          <input type='text' id='lastname' a-model='user.person.lastname'/>
        </div>
      </div>
      <div>
        <div>
          <label for='zipcode'>Zipcode</label>
          <input type='text' id='zipcode' a-model='user.address.zipcode'/>
        </div>
        <div>
          <label for='street'>Street</label>
          <input type='text' id='street' a-model='user.address.street'/>
        </div>
        <div>
          <label for='housenumber'>Housenumber</label>
          <input type='number' id='housenumber' a-model='user.address.housenumber'/>
        </div>
      </div>
      <pre>{{ user }}</pre>
    </form>
  </div>
  <!-- <div class='wrapper flex flexcolumn vcenter'>
    <div class='flex'><span class='label'>Input: </span><code class='input flex hcenter'></code></div>
  </div>
  <div class="trees flex hcenter flexcolumn">
    <div class='parseTreeContainer'>
      <h2>Parse tree</h2>
      <div class='parseTree flex'>
      </div>
    </div>
    <div class='ast flex flexcolumn vcenter'>
      <h2>AST</h2>
      <div class='ASTTree flex'></div>
    </div>
  </div>
  <div class='parseTableContainer'>
    <h2>Parse chart</h2>
    <div class='parseTable flex'>
    </div>
  </div> -->
</body>

</html>
